<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Instructors | San Juan Academy </title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

<body>
<div id="header-placeholder"></div>

<main class="container py-1">
    <section
        id="classes"
        class="mb-5">
        <div class="mb-4">
            <h2>
                List of Instructors
            </h2>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h3 class="h4">Gerardo Gala</h3>
                            <span class="badge text-bg-success">
                                Available
                            </span>
                        </div>
                        <figure class="text-center my-4">
                            <img src="images/instructor1.jpg" alt="Instructor"
                            class="img-fluid w-50 rounded border shadow-sm">
                            <p class="mt-3">Served 2 years as Race Officer at Lake Canyon Yacht Club in Canyon Lake, TX.  </p>
                            <p class="mt-3">Served 2 years in Toastmaster as Vice President Public Relations and as Sergeant at Arms</p>
                            <p class="mt-3">Bachelor's Degree from DeVry University Phoenix, AZ</p>
                        </figure>
                        </div>
                </div>
            </div>
        </div>
        <br>
        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h3 class="h4">Divine Orciga</h3>
                            <span class="badge text-bg-success">
                                Available
                            </span>
                        </div>
                        <figure class="text-center my-4">
                            <img src="images/instructor2.jpg" alt="Instructor"
                            class="img-fluid w-50 rounded border shadow-sm">
                            <p class="mt-3">Bachelor's Degree from Bicol University, Bicol, Philippines</p>
                            <p class="mt-3">14 years of teaching experience at ADT Montessori School</p>
                        </figure>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<div id="footer-placeholder">
</div>
     <!-- Bootstrap JavaScript -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

     <script src="js/layout.js"></script>
     <script src="js/social.js"></script>
