<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental | San Juan Academy</title>

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. External Fonts Second -->
  <link href="https://googleapis.com" rel="stylesheet">

  <!-- 3. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>
<div id="header-placeholder"></div>

<main class="container py-5">
    <section
        id="classes"
        class="mb-5">
        <div class="mb-4">
            <h2>
                List of Sailboats For Rent
            </h2>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h3 class="h4">ILCA 7</h3>
                            <span class="badge text-bg-success">
                                Available
                            </span>
                        </div>
                        <p class="mt-3">
                            Book this ILCA 7 for a challenging sail.
                        </p>
                        <figure class="text-center my-4">
                            <img src="images/ilca7.jpg" alt="Instructor"
                            class="img-fluid w-50 rounded border shadow-sm">
                        </figure>
                        <p class="text-muted">
                            Fast, responsive single-handed dinghy.
                        </p>
                        <p class="text-muted">
                            P5000 per session.
                        </p>
                        <!-- Booking -->
                        <div class="mt-3">
                            <a href="https://sanjuanacademy.setmore.com/services/4d1ae10b-d1e5-4c04-af2a-78ca27e64f2a"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn btn-primary">
                                Book This ILCA 7
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <br>
        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h3 class="h4">Open Skiff</h3>
                            <span class="badge text-bg-success">
                                Available
                            </span>
                        </div>
                        <p class="mt-3">
                            Perfect for juniors.
                        </p>
                        <figure class="text-center my-4">
                            <img src="images/openskiff.jpg" alt="Instructor"
                            class="img-fluid w-50 rounded border shadow-sm">
                        </figure>

                        <p class="text-muted">
                            P2500 per session.
                        </p>

                        <!-- Booking -->
                        <div class="mt-3">
                            <a href="https://sanjuanacademy.setmore.com/services/2d5d6924-a94e-453b-857d-7a681f6601ce"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn btn-primary">
                                Book This Open Skiff
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <br>
    </section>
</main>
<div id="footer-placeholder">
</div>
     <!-- Bootstrap JavaScript -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
     <script type="module" src="js/index.js"></script>
     <script src="js/layout.js"></script>
     <script src="js/social.js"></script>
</body>
</html>
