<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Sign In | San Juan Academy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Academy CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

    <!-- ==================================================
        SIGN IN
    ================================================== -->

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i
                                class="bi bi-person-circle display-4">
                            </i>
                            <h1 class="h3 mt-3">
                                Student Sign In
                            </h1>
                            <p class="text-muted">
                                Sign in to access your Academy dashboard.
                            </p>
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="text"
                                class="form-control"
                                id="password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <div class="d-grid mt-4">
                            <button
                                type="button"
                                class="btn btn-primary btn-lg"
                                id="signInButton">
                                Sign In
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <p class="mb-1">
                                Don't have an account?
                            </p>
                            <a href="createAccount.html">
                                Create an Account
                            </a>
                        </div>


                        <div
                            id="signInMessage"
                            class="alert alert-info mt-4 d-none">
                            Authentication will be connected
                            to Firebase here.
                        </div>

                        <div class="text-center mt-4">
                            <a href="index.html">
                                Back to San Juan Academy
                            </a>
                        </div>
                    </div>



                </div>
            </div>
        </div>
    </main>

    <!-- ==================================================
        FOOTER
    ================================================== -->

    <footer class="container text-center py-4">

    <hr>

    <p class="mb-0">
    © 2026 San Juan Academy
    </p>

</footer>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
<script type="module" src="js/signin.js">
</script>
</body>

</html>
