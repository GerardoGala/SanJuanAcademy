<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | San Juan Academy</title>

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. External Fonts Second -->
  <link href="https://googleapis.com" rel="stylesheet">

  <!-- 3. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

    <!-- ==================================================
        SIGN IN
    ================================================== -->

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i
                                class="bi bi-person-circle display-4">
                            </i>
                            <h1 class="h3 mt-3">
                                Student Sign In
                            </h1>
                            <p class="text-muted">
                                Sign in to access your Academy dashboard.
                            </p>
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="text"
                                class="form-control"
                                id="password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <div class="d-grid mt-4">
                            <button
                                type="button"
                                class="btn btn-primary btn-lg"
                                id="signInButton">
                                Sign In
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <p class="mb-1">
                                Don't have an account?
                            </p>
                            <a href="createAccount.html">
                                Create an Account
                            </a>
                        </div>


                        <div
                            id="signInMessage"
                            class="alert alert-info mt-4 d-none">
                            Authentication will be connected
                            to Firebase here.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

<div id="footer-placeholder">
</div>
     <!-- Bootstrap JavaScript -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
     <script type="module" src="js/index.js"></script>
     <script src="js/layout.js"></script>
     <script src="js/social.js"></script>
     <script type="module" src="js/signin.js"></script>
</body>


</html>
