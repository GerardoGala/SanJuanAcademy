<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Student Account | San Juan Academy</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Academy CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ==================================================
     NAVIGATION
================================================== -->

<nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            San Juan Academy

        </a>

    </div>

</nav>


<!-- ==================================================
     CREATE ACCOUNT
================================================== -->

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!-- Heading -->

                    <div class="text-center mb-4">
                        <i
                            class="bi bi-person-plus display-4">
                        </i>

                        <h1 class="h3 mt-3">
                            Create Student Account
                        </h1>

                        <p class="text-muted">
                            Create your San Juan Academy
                            student account.
                        </p>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input type="email" class="form-control" id="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input type="password" class="form-control" id="password" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">

                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword"
                            autocomplete="new-password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="button" class="btn btn-primary btn-lg" id="createAccountButton">
                            Create Account
                        </button>
                    </div>

                    <div id="createAccountMessage" class="alert mt-4 d-none">
                    </div>


                    <div class="text-center mt-4">
                        <p class="mb-1">
                            Already have an account?
                        </p>
                        <a href="signin.html">
                            Student Sign In
                        </a>
                    </div>


                </div>

            </div>

        </div>

    </div>

</main>


<!-- ==================================================
     FOOTER
================================================== -->

<footer class="container text-center py-4">

    <hr>

    <p class="mb-0">

        © 2026 San Juan Academy

    </p>

</footer>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<script type="module" src="js/createAccount.js">
</script>
</body>

</html>
