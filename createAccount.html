<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | San Juan Academy</title>

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">  
</head>


<body>
<div id="header-placeholder"></div>
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!-- Heading -->

                    <div class="text-center mb-4">
                        <i
                            class="bi bi-person-plus display-4">
                        </i>

                        <h1 class="h3 mt-3">
                            Create Student Account
                        </h1>

                        <p class="text-muted">
                            Create your San Juan Academy
                            student account.
                        </p>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input type="email" class="form-control" id="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input type="password" class="form-control" id="password" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">

                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword"
                            autocomplete="new-password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="button" class="btn btn-primary btn-lg" id="createAccountButton">
                            Create Account
                        </button>
                    </div>

                    <div id="createAccountMessage" class="alert mt-4 d-none">
                    </div>


                    <div class="text-center mt-4">
                        <p class="mb-1">
                            Already have an account?
                        </p>
                        <a href="signin.html">
                            Student Sign In
                        </a>
                    </div>


                </div>

            </div>

        </div>

    </div>

</main>
<div id="footer-placeholder">
</div>
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/index.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/social.js"></script>
    <script type="module" src="js/createAccount.js"></script>
</body>
</html>
